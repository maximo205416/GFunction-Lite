<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GFunction Lite — descargas oficiales y EEG desde GitHub."
    />
    <title>GFunction Lite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar glass-panel">
        <button class="brand-button" data-screen="home" type="button" aria-label="Inicio">
          <span class="brand-mark">G</span>
          <span class="brand-name">GFunction Lite</span>
        </button>
      </header>

      <main class="app-shell">
        <section id="home-screen" class="screen active">
          <div class="glass-panel main-panel">
            <p class="eyebrow">Web oficial</p>
            <h1>¿Dónde quieres ir?</h1>

            <div class="cta-row">
              <button
                class="box start-btn fx-layer"
                id="start-download-button"
                type="button"
                aria-label="Get started"
                style="--w: clamp(220px, 46vw, 320px); --h: 78px; --tr: 18%;"
              >
                <span class="text">Descargas</span>
                <span class="btn-icon" aria-hidden="true">
                  <svg
                    class="svg"
                    viewBox="0 0 1024 1024"
                    version="1.1"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M779.180132 473.232045 322.354755 16.406668c-21.413706-21.413706-56.121182-21.413706-77.534887 0-21.413706 21.413706-21.413706 56.122205 0 77.534887l418.057421 418.057421L244.819868 930.057421c-21.413706 21.413706-21.413706 56.122205 0 77.534887 10.706853 10.706853 24.759917 16.059767 38.767955 16.059767s28.061103-5.353938 38.767955-16.059767L779.180132 550.767955C800.593837 529.35425 800.593837 494.64575 779.180132 473.232045z"
                    ></path>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </section>

        <section id="downloads-screen" class="screen">
          <div class="glass-panel content-panel">
            <div class="section-header">
              <div class="header-left">
                <button class="back-button" data-screen="home" type="button" aria-label="Volver al inicio">←</button>
                <div>
                  <p class="eyebrow">Descargas</p>
                  <h2>Versiones</h2>
                </div>
              </div>
              <button class="ghost-button" data-screen="beta" type="button">Versiones Beta</button>
            </div>

            <div id="stable-container" class="card-list" aria-live="polite"></div>
          </div>
        </section>

        <section id="beta-screen" class="screen">
          <div class="glass-panel content-panel">
            <div class="section-header">
              <div class="header-left">
                <button class="back-button" data-screen="downloads" type="button" aria-label="Volver a versiones">←</button>
                <div>
                  <p class="eyebrow">Betas</p>
                  <h2>Versiones Beta</h2>
                </div>
              </div>
            </div>

            <div id="beta-container" class="card-list" aria-live="polite"></div>
          </div>
        </section>

        <section id="eeg-screen" class="screen">
          <div class="glass-panel content-panel">
            <div class="section-header">
              <div class="header-left">
                <button class="back-button" data-screen="home" type="button" aria-label="Volver al inicio">←</button>
                <div>
                  <p class="eyebrow">EEG</p>
                  <h2>Archivos EEG</h2>
                </div>
              </div>
            </div>

            <div id="eeg-container" class="card-list" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="download-modal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal-panel glass-panel" role="dialog" aria-modal="true" aria-labelledby="download-modal-title">
        <p class="eyebrow">Confirmación</p>
        <h3 id="download-modal-title">Descargar archivo</h3>
        <p id="download-modal-message">¿Quieres descargar este archivo?</p>
        <div class="modal-actions">
          <button class="modal-button modal-button-secondary" type="button" id="download-modal-cancel">Cancelar</button>
          <button class="modal-button modal-button-primary" type="button" id="download-modal-confirm">Descargar</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
